name: Deploy

# RETIRED. The live demo moved to GitHub Pages (the model now runs in the
# browser on WebGPU), so this home-server gallery deploy is no longer used.
# The file is kept for reference but disabled: the `release` auto-trigger is
# removed and the job is gated off with `if: false`, so it never runs.
#
# (Historical) It deployed a new image to the production server on every
# published Release. The server was expected to have:
#   - Docker with the NVIDIA Container Toolkit (--gpus all works)
#   - The deploy SSH key registered in ~/.ssh/authorized_keys
#   - The checkpoints/ directory at DEPLOY_CHECKPOINTS_DIR

on:
  # Manual-only, and the job is gated off below — kept just so the file
  # remains valid and visible in the Actions tab without ever executing.
  workflow_dispatch:

permissions:
  contents: read

# Only one production deploy can run at a time. If a deploy is in flight when
# a newer release lands, finish the current one then run the new one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://qr-bloom.rocknroll17.com/
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          CHECKPOINTS_DIR: ${{ secrets.DEPLOY_CHECKPOINTS_DIR }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # On a release event, pin to that exact tag — pulling :latest races
          # release.yml and can resolve to the *previous* version that still
          # answers under :latest, leaving prod a release behind.
          envs: RELEASE_TAG,INPUT_TAG,CHECKPOINTS_DIR,HF_TOKEN
          script: |
            set -e
            TAG="${INPUT_TAG:-${RELEASE_TAG:-latest}}"
            IMAGE="ghcr.io/rocknroll17/qr-bloom:${TAG}"
            CHECKPOINTS="${CHECKPOINTS_DIR}"
            HF_REPO="rocknroll17/QR-Bloom"

            echo "==> Syncing checkpoints from Hugging Face Hub (${HF_REPO})"
            # Compare HF's x-linked-etag (sha256 of the underlying file) against
            # the local file's sha256. Download only if different. Atomic
            # replace via .tmp + mv so a running container never sees a
            # partial file.
            mkdir -p "${CHECKPOINTS}"
            for V in 2 3 4 5; do
              for SUFFIX in "" "_best"; do
                F="qrbloom_v${V}${SUFFIX}.pt"
                URL="https://huggingface.co/${HF_REPO}/resolve/main/${F}"
                DEST="${CHECKPOINTS}/${F}"
                remote_sha=$(curl -fsSL -H "Authorization: Bearer ${HF_TOKEN}" -I "${URL}" \
                  | tr -d '\r' \
                  | awk 'tolower($1)=="x-linked-etag:" {gsub(/"/,"",$2); print $2; exit}')
                if [ -z "${remote_sha}" ]; then
                  echo "  ${F}: WARN no x-linked-etag from HF, skipping"
                  continue
                fi
                if [ -f "${DEST}" ]; then
                  local_sha=$(sha256sum "${DEST}" | awk '{print $1}')
                  if [ "${local_sha}" = "${remote_sha}" ]; then
                    echo "  ${F}: up to date (${remote_sha:0:12})"
                    continue
                  fi
                  echo "  ${F}: changed (local ${local_sha:0:12} -> remote ${remote_sha:0:12})"
                else
                  echo "  ${F}: new (${remote_sha:0:12})"
                fi
                curl -fsSL -H "Authorization: Bearer ${HF_TOKEN}" -o "${DEST}.tmp" "${URL}"
                got_sha=$(sha256sum "${DEST}.tmp" | awk '{print $1}')
                if [ "${got_sha}" != "${remote_sha}" ]; then
                  echo "  ${F}: ERROR sha256 mismatch after download (${got_sha} != ${remote_sha})"
                  rm -f "${DEST}.tmp"; exit 1
                fi
                mv "${DEST}.tmp" "${DEST}"
                echo "  ${F}: synced"
              done
            done

            echo "==> Pulling ${IMAGE}"
            # release.yml fires on the same tag push and races us. If the
            # image isn't on GHCR yet (manifest unknown), retry for up to a
            # few minutes before giving up.
            for i in 1 2 3 4 5 6 7 8; do
              if docker pull "${IMAGE}"; then
                break
              fi
              if [ "$i" = "8" ]; then
                echo "ERROR: image ${IMAGE} still not available after $((i * 15))s; aborting."
                exit 1
              fi
              echo "image not available yet, retrying in 15s (attempt $i/8)..."
              sleep 15
            done

            echo "==> Stopping existing qrbloom-gallery (if any)"
            docker rm -f qrbloom-gallery 2>/dev/null || true

            echo "==> Stopping any other container holding host port 8001"
            for c in $(docker ps --filter "publish=8001" -q); do
              echo "    removing $c"
              docker rm -f "$c" || true
            done

            echo "==> Starting new container from ${IMAGE}"
            # Log rotation caps container logs at ~30MB (3 files × 10MB) so
            # disk usage stays bounded under heavy traffic.
            docker run -d \
              --name qrbloom-gallery \
              --restart unless-stopped \
              --gpus all \
              -p 8001:8000 \
              -v "${CHECKPOINTS}:/app/checkpoints:ro" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "${IMAGE}"

            echo "==> Removing old qr-bloom images (keep only the one in use)"
            # Find the image id the new container is using, then remove any
            # other ghcr.io/rocknroll17/qr-bloom image. Scoped strictly to
            # that repository so other images on this host — including any
            # locally-built qrbloom variants, dangling layers from unrelated
            # projects, etc. — are never touched.
            KEEP_ID=$(docker inspect --format '{{.Image}}' qrbloom-gallery | sed 's/^sha256://')
            for id in $(docker images "ghcr.io/rocknroll17/qr-bloom" -q | sort -u); do
              if [ "$id" != "$KEEP_ID" ]; then
                # docker rmi only releases layers that are no longer referenced
                # by any other image, so shared base layers (python:3.x-slim,
                # libgomp1, etc.) stay intact for everything else on the host.
                docker rmi "$id" 2>/dev/null || true
              fi
            done

            echo "==> Status"
            docker ps --filter name=qrbloom-gallery \
              --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo "==> Disk used by docker"
            docker system df
