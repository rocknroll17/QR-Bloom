name: Deploy

# Pushes a new image to the production server (qr-bloom.rocknroll17.com)
# whenever a Release is published, or on-demand via workflow_dispatch.
#
# The server is expected to have:
#   - Docker with the NVIDIA Container Toolkit (--gpus all works)
#   - The deploy SSH key registered in ~/.ssh/authorized_keys
#   - The checkpoints/ directory at DEPLOY_CHECKPOINTS_DIR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to pull (e.g. v1.1.4, defaults to latest)'
        required: false
        default: 'latest'

permissions:
  contents: read

# Only one production deploy can run at a time. If a deploy is in flight when
# a newer release lands, finish the current one then run the new one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://qr-bloom.rocknroll17.com/
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            TAG="${{ github.event.inputs.tag || 'latest' }}"
            IMAGE="ghcr.io/rocknroll17/qr-bloom:${TAG}"
            CHECKPOINTS="${{ secrets.DEPLOY_CHECKPOINTS_DIR }}"

            echo "==> Pulling ${IMAGE}"
            # release.yml fires on the same tag push and races us. If the
            # image isn't on GHCR yet (manifest unknown), retry for up to a
            # few minutes before giving up.
            for i in 1 2 3 4 5 6 7 8; do
              if docker pull "${IMAGE}"; then
                break
              fi
              if [ "$i" = "8" ]; then
                echo "ERROR: image ${IMAGE} still not available after $((i * 15))s; aborting."
                exit 1
              fi
              echo "image not available yet, retrying in 15s (attempt $i/8)..."
              sleep 15
            done

            echo "==> Stopping existing qrbloom-gallery (if any)"
            docker rm -f qrbloom-gallery 2>/dev/null || true

            echo "==> Stopping any other container holding host port 8001"
            for c in $(docker ps --filter "publish=8001" -q); do
              echo "    removing $c"
              docker rm -f "$c" || true
            done

            echo "==> Starting new container from ${IMAGE}"
            # Log rotation caps container logs at ~30MB (3 files × 10MB) so
            # disk usage stays bounded under heavy traffic.
            docker run -d \
              --name qrbloom-gallery \
              --restart unless-stopped \
              --gpus all \
              -p 8001:8000 \
              -v "${CHECKPOINTS}:/app/checkpoints:ro" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "${IMAGE}"

            echo "==> Removing old qr-bloom images (keep only the one in use)"
            # Find the image id the new container is using, then remove any
            # other ghcr.io/rocknroll17/qr-bloom image. Scoped strictly to
            # that repository so other images on this host — including any
            # locally-built qrbloom variants, dangling layers from unrelated
            # projects, etc. — are never touched.
            KEEP_ID=$(docker inspect --format '{{.Image}}' qrbloom-gallery | sed 's/^sha256://')
            for id in $(docker images "ghcr.io/rocknroll17/qr-bloom" -q | sort -u); do
              if [ "$id" != "$KEEP_ID" ]; then
                # docker rmi only releases layers that are no longer referenced
                # by any other image, so shared base layers (python:3.x-slim,
                # libgomp1, etc.) stay intact for everything else on the host.
                docker rmi "$id" 2>/dev/null || true
              fi
            done

            echo "==> Status"
            docker ps --filter name=qrbloom-gallery \
              --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo "==> Disk used by docker"
            docker system df
