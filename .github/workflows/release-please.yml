name: release-please

# Watches conventional commits on main. When fix:/feat:/etc. land, opens a
# "chore(main): release X.Y.Z" PR with an auto-generated changelog. Merging
# that PR pushes the vX.Y.Z tag and creates the GitHub Release — which then
# triggers release.yml to build and publish the Docker image with semver tags.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Use a personal access token so the tag push the action makes can
          # trigger downstream workflows (release.yml). Tag pushes made with
          # the default GITHUB_TOKEN do not trigger other workflows by design,
          # which would otherwise leave new versions without a Docker image.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
