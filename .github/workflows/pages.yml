name: Deploy GitHub Pages demo

# Builds and publishes the static demo at docs/ to GitHub Pages on every push
# to main. The build step regenerates the procedural voxel samples so the
# deployed page always matches the latest treegen.py.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_pages_demo.py'
      - 'qrbloom/treegen.py'
      - 'qrbloom/qr.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install demo dependencies
        run: pip install numpy segno

      - name: Regenerate voxel samples
        run: python scripts/build_pages_demo.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
