    - img [ref=e15]
    - heading "Privacy Policy" [level=1] [ref=e17]
    - paragraph [ref=e18]: "Last updated: April 17, 2025"
    - paragraph [ref=e19]: We built Grow-Voxly to be simple and transparent. This page explains exactly what data we collect, why we collect it, and how you can control it. We believe privacy is a right, not a checkbox.
  - generic [ref=e20]:
    - generic [ref=e22]:
      - generic [ref=e23]:
        - img [ref=e25]
        - heading "Information We Collect" [level=2] [ref=e29]
      - generic [ref=e30]:
        - generic [ref=e31]:
          - heading "Account Information" [level=3] [ref=e32]
          - paragraph [ref=e33]: When you create an account we collect your email address and, if you sign in via Google, your display name and profile picture. We do not collect payment information — Grow-Voxly is free to use.
        - generic [ref=e34]:
          - heading "Content You Create" [level=3] [ref=e35]
          - paragraph [ref=e36]: We store the URLs you shorten, the custom slugs you choose, and the tree species and tile shape you select. This data is necessary to serve your QR codes and redirect visitors.
        - generic [ref=e37]:
          - heading "Usage Data" [level=3] [ref=e38]
          - paragraph [ref=e39]: Each time a visitor scans one of your QR codes, we increment a click counter associated with that link. We do not log the IP address or device of the scanner.
    - generic [ref=e41]:
      - generic [ref=e42]:
        - img [ref=e44]
        - heading "How We Use Your Information" [level=2] [ref=e47]
      - generic [ref=e48]:
        - generic [ref=e49]:
          - heading "To Operate the Service" [level=3] [ref=e50]
          - paragraph [ref=e51]: Your email is used to authenticate your account and send transactional messages (e.g. password resets). Your link data is used solely to generate QR codes and redirect end-users.
        - generic [ref=e52]:
          - heading "To Improve the Service" [level=3] [ref=e53]
          - paragraph [ref=e54]: Aggregate, anonymised usage patterns help us understand which tree species are most popular and how the engine performs under load. This data cannot be traced back to an individual user.
        - generic [ref=e55]:
          - heading "We Do Not Sell Your Data" [level=3] [ref=e56]
          - paragraph [ref=e57]: Grow-Voxly does not sell, rent, or trade your personal information to any third party, for any purpose, ever.
    - generic [ref=e59]:
      - generic [ref=e60]:
        - img [ref=e62]
        - heading "Third-Party Services" [level=2] [ref=e65]
      - generic [ref=e66]:
        - generic [ref=e67]:
          - heading "Firebase (Google)" [level=3] [ref=e68]
          - paragraph [ref=e69]: Authentication and database storage are handled by Google Firebase. Your data is stored in Firebase's servers and governed by Google's privacy policies in addition to ours. We use Firestore and Firebase Authentication.
        - generic [ref=e70]:
          - heading "Vercel" [level=3] [ref=e71]
          - paragraph [ref=e72]: Grow-Voxly is hosted on Vercel. Server request logs (including IP addresses) may be retained by Vercel according to their own data retention policies. We do not access these logs in normal operation.
        - generic [ref=e73]:
          - heading "Google Sign-In" [level=3] [ref=e74]
          - paragraph [ref=e75]: If you choose to log in with Google, Google will share your email address and public profile with us. We do not receive your Google password or any private profile data.
    - generic [ref=e77]:
      - generic [ref=e78]:
        - img [ref=e80]
        - heading "Cookies & Local Storage" [level=2] [ref=e82]
      - generic [ref=e83]:
        - generic [ref=e84]:
          - heading "Authentication Cookies" [level=3] [ref=e85]
          - paragraph [ref=e86]: Firebase sets a session cookie to keep you logged in between visits. This cookie is strictly necessary for the service to function and is not used for tracking or advertising.
        - generic [ref=e87]:
          - heading "No Analytics Cookies" [level=3] [ref=e88]
          - paragraph [ref=e89]: We do not use Google Analytics, Meta Pixel, or any third-party advertising or tracking cookies. No cross-site tracking is performed on Grow-Voxly.
    - generic [ref=e91]:
      - generic [ref=e92]:
        - img [ref=e94]
        - heading "Data Security" [level=2] [ref=e97]
      - generic [ref=e98]:
        - generic [ref=e99]:
          - heading "Encryption in Transit" [level=3] [ref=e100]
          - paragraph [ref=e101]: All communication between your browser and our servers is encrypted via HTTPS/TLS. Firebase enforces HTTPS on all requests.
        - generic [ref=e102]:
          - heading "Access Controls" [level=3] [ref=e103]
          - paragraph [ref=e104]: Firestore Security Rules ensure that each user can only read and write their own link data. No user can access another user's trees, slugs, or click counts.
        - generic [ref=e105]:
          - heading "Limitations" [level=3] [ref=e106]
          - paragraph [ref=e107]: No system is perfectly secure. While we take reasonable precautions, we cannot guarantee the absolute security of data transmitted over the internet. Please use a strong, unique password.
    - generic [ref=e109]:
      - generic [ref=e110]:
        - img [ref=e112]
        - heading "Your Rights" [level=2] [ref=e116]
      - generic [ref=e117]:
        - generic [ref=e118]:
          - heading "Access & Deletion" [level=3] [ref=e119]
          - paragraph [ref=e120]: You can view all data we hold about you via your Dashboard. You may delete any link at any time. To permanently delete your account and all associated data, contact us at the email below.
        - generic [ref=e121]:
          - heading "Data Portability" [level=3] [ref=e122]
          - paragraph [ref=e123]: You can copy any of your short links and QR images directly from the Dashboard. No special export request is needed.
        - generic [ref=e124]:
          - heading "Residents of the EEA / UK / California" [level=3] [ref=e125]
          - paragraph [ref=e126]: You have additional rights under GDPR, UK-GDPR, and CCPA including the right to rectification, restriction of processing, and the right to object. Contact us to exercise these rights.
