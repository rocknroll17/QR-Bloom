<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>QR-Bloom — live demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta property="og:title" content="QR-Bloom"/>
<meta property="og:description" content="A 3D voxel tree whose top-down silhouette is a scannable QR code."/>
<style>
  :root {
    --bg: #f8fafc;
    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --line: #e2e8f0;
    --paper: #ffffff;
    --accent: #16a34a;
    --blue: #2563eb;
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  canvas { display: block; }

  /* Header — wordmark + tagline + repo link. */
  #header {
    position: fixed; top: 18px; left: 22px; z-index: 11;
    display: flex; flex-direction: column; gap: 2px;
    user-select: none;
  }
  #brand {
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--ink);
    text-decoration: none;
  }
  #tagline {
    font-size: 12px; color: var(--ink-soft);
    max-width: 320px;
    line-height: 1.4;
  }
  #repo-link {
    position: fixed; top: 18px; right: 22px; z-index: 11;
    font-size: 12.5px; font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 7px 12px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    transition: color 0.15s;
  }
  #repo-link:hover { color: var(--ink); }

  /* Dock — floating control panel at the bottom. */
  #dock {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    z-index: 10;
    width: min(640px, calc(100% - 28px));
    padding: 10px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow:
      0 18px 48px -12px rgba(15, 23, 42, 0.22),
      0 2px 6px rgba(15, 23, 42, 0.05);
  }
  #theme-select {
    flex: 1; min-width: 0;
    font: inherit; font-size: 13.5px;
    padding: 10px 28px 10px 13px;
    background: var(--paper)
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%2394a3b8' stroke-width='1.6' stroke-linecap='round' d='M1 1l4 4 4-4'/></svg>")
      no-repeat right 10px center;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  #theme-select:focus { border-color: var(--blue); }
  .view-btn {
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 10px 14px;
    background: var(--paper);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .view-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .view-btn.active {
    color: #fff; background: var(--ink);
    border-color: var(--ink);
  }

  /* Info chip — bottom-left, shows current sample text/version. */
  #info {
    position: fixed; left: 22px; bottom: 22px; z-index: 9;
    font-size: 12px; color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  #info code {
    font-size: 12px;
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--ink);
  }

  @media (max-width: 600px) {
    #header { top: 14px; left: 16px; }
    #repo-link { top: 14px; right: 16px; }
    #tagline { display: none; }
    #info { left: 16px; bottom: auto; top: 64px; }
  }
</style>
</head>
<body>

<div id="header">
  <span id="brand">QR-Bloom</span>
  <span id="tagline">A 3D voxel tree whose top-down silhouette is a scannable QR code.</span>
</div>
<a id="repo-link" href="https://github.com/rocknroll17/QR-Bloom" target="_blank" rel="noopener">GitHub →</a>

<div id="dock">
  <select id="theme-select" aria-label="Tree theme"></select>
  <button class="view-btn active" id="view-tree" type="button">Tree</button>
  <button class="view-btn" id="view-qr" type="button">QR</button>
</div>

<div id="info">
  <span id="info-label">Loading…</span>
  &nbsp;·&nbsp;
  <code id="info-text">—</code>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import { Viewer } from './qrbloom-viewer.js';

const viewer = new Viewer(document.body);

const select = document.getElementById('theme-select');
const infoLabel = document.getElementById('info-label');
const infoText = document.getElementById('info-text');
const viewTree = document.getElementById('view-tree');
const viewQr = document.getElementById('view-qr');

function setActive(mode) {
  viewTree.classList.toggle('active', mode === 'tree');
  viewQr.classList.toggle('active', mode === 'qr');
}
viewTree.addEventListener('click', () => { viewer.switchMode('tree'); setActive('tree'); });
viewQr.addEventListener('click',   () => { viewer.switchMode('qr');   setActive('qr');   });

async function loadJSON(path) {
  const r = await fetch(path, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`fetch failed: ${r.status} ${path}`);
  return r.json();
}

async function showSample(file, label) {
  const data = await loadJSON(file);
  viewer.setCells(data.cells);
  infoLabel.textContent = label;
  infoText.textContent = data.text;
}

(async () => {
  try {
    const manifest = await loadJSON('samples/manifest.json');
    for (const t of manifest.themes) {
      const opt = document.createElement('option');
      opt.value = t.file;
      opt.textContent = t.label;
      opt.dataset.label = t.label;
      select.appendChild(opt);
    }
    select.addEventListener('change', () => {
      const opt = select.options[select.selectedIndex];
      showSample(opt.value, opt.dataset.label);
    });
    if (manifest.themes.length > 0) {
      await showSample(manifest.themes[0].file, manifest.themes[0].label);
    }
  } catch (e) {
    infoLabel.textContent = 'Failed to load samples';
    infoText.textContent = e.message;
    console.error(e);
  }
})();
</script>
</body></html>
