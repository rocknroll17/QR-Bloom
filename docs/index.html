<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>QR-Bloom — live demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta property="og:title" content="QR-Bloom"/>
<meta property="og:description" content="A 3D voxel tree whose top-down silhouette is a scannable QR code."/>
<style>
  :root {
    --bg: #f8fafc;
    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --paper: #ffffff;
    --accent: #16a34a;
    --accent-hover: #15803d;
    --blue: #2563eb;
    --blue-hover: #1d4ed8;
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  canvas { display: block; }

  /* Brand wordmark — top-left, never blocks interaction. */
  #brand {
    position: fixed; top: 18px; left: 22px; z-index: 11;
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--ink);
    text-decoration: none;
    user-select: none;
    transition: opacity 0.15s;
  }
  #brand:hover { opacity: 0.6; }

  /* Dock — single floating panel that holds every control. */
  #dock {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    z-index: 10;
    width: min(740px, calc(100% - 28px));
    padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow:
      0 18px 48px -12px rgba(15, 23, 42, 0.22),
      0 2px 6px rgba(15, 23, 42, 0.05);
  }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }

  /* Input row */
  #url-input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 13.5px;
    padding: 10px 13px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #url-input::placeholder { color: var(--ink-faint); }
  #url-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
  }
  #url-theme {
    font: inherit; font-size: 13px;
    padding: 10px 28px 10px 12px;
    background: var(--paper)
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%2394a3b8' stroke-width='1.6' stroke-linecap='round' d='M1 1l4 4 4-4'/></svg>")
      no-repeat right 10px center;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer; outline: none;
    appearance: none; -webkit-appearance: none;
    max-width: 150px;
  }
  #url-theme:focus { border-color: var(--blue); }
  #url-gen {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    white-space: nowrap;
  }
  #url-gen:hover:not(:disabled) { background: var(--accent-hover); }
  #url-gen:active:not(:disabled) { transform: translateY(1px); }
  #url-gen:disabled { opacity: 0.55; cursor: wait; }

  /* Controls row — divider sits between the two rows. */
  .row.controls {
    padding: 8px 2px 2px;
    border-top: 1px dashed var(--line);
  }
  #mode-toggle {
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px;
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s;
    min-width: 58px;
    letter-spacing: 0.02em;
  }
  #mode-toggle:hover { opacity: 0.86; }

  .tool {
    font: inherit; font-size: 12.5px; font-weight: 500;
    padding: 7px 13px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tool:hover:not(:disabled) {
    background: #f1f5f9;
    border-color: var(--line-strong);
  }
  .tool:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Before the first generation: keep the row's space (no layout jump) but
     hide only the buttons — the status text stays visible. */
  #controls-row.pending button { visibility: hidden; }
  #copy-embed-btn.copied {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  #url-status {
    font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-left: auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 4px;
  }
  #url-status .pbar {
    display: inline-block; width: 92px; height: 6px; border-radius: 3px;
    background: var(--line); vertical-align: middle; overflow: hidden; margin: 0 7px;
  }
  #url-status .pbar > i {
    display: block; height: 100%; width: 0; background: var(--accent);
    transition: width .15s ease;
  }

  /* Mobile layout */
  @media (max-width: 640px) {
    #brand { top: 14px; left: 16px; font-size: 14px; }
    #dock {
      bottom: 12px;
      width: calc(100% - 20px);
      padding: 9px;
      border-radius: 13px;
    }
    .row { flex-wrap: wrap; gap: 7px; }
    #url-input { flex: 1 1 100%; font-size: 16px; padding: 11px 13px; }
    #url-theme { flex: 1 1 auto; max-width: none; }
    #url-gen { flex: 1 1 auto; }
    .row.controls { gap: 6px; }
    #url-status {
      flex: 1 1 100%;
      margin-left: 0;
      text-align: right;
      padding-top: 4px;
    }
  }

  /* ?nohud — clean view used for captures/embeds. */
  html.nohud #brand, html.nohud #dock { opacity: 0; pointer-events: none; }
</style>
<script>
  // ?nohud — apply the clean view before the body parses, so no post-load
  // DOM mutation is needed (which can disrupt the WebGL canvas).
  if (new URLSearchParams(location.search).has('nohud'))
    document.documentElement.classList.add('nohud');
</script>
</head><body>
<a id="brand" href="/">QR-Bloom</a>

<div id="dock">
  <div class="row">
    <input id="url-input" type="text"
           placeholder="Paste a link or short text, then press Enter"
           spellcheck="false" autocomplete="off"/>
    <select id="url-theme" aria-label="Theme"></select>
    <button id="url-gen">Generate</button>
  </div>
  <div class="row controls pending" id="controls-row">
    <button id="mode-toggle">3D</button>
    <button id="snap" class="tool">Save PNG</button>
    <button id="copy-embed-btn" class="tool">Copy embed</button>
    <span id="url-status"></span>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import { Viewer } from './qrbloom-viewer.js?v=2';

// Generation backend. A self-hosted gallery injects window.QRBLOOM_API when
// it serves this page, which switches generation to its REST API — and only
// then is the API client module even fetched. Without the flag (the static
// GitHub Pages deployment) the in-browser diffusion stack loads instead, so
// each mode ships only its own code.
const client = window.QRBLOOM_API
  ? new (await import('./qrbloom-api-client.js?v=1')).ApiClient(window.QRBLOOM_API)
  : (await import('./qrbloom-inference.js?v=3')).qrbloom;

// Single shared viewer — same rendering code in both deployments.
const viewer = new Viewer(document.body);

let _embedCells = [];

function showCells(cells) {
  _embedCells = cells || [];
  viewer.setCells(cells, true);   // animate: grow the new tree in from the ground up
  // reveal the view / export buttons once there's something to act on
  // (drops .pending — the row kept its space, so nothing jumps; status stays)
  document.getElementById('controls-row').classList.remove('pending');
}

document.getElementById('mode-toggle').onclick = () => {
  const next = (viewer.mode === 'tree') ? 'qr' : 'tree';
  viewer.switchMode(next);
  document.getElementById('mode-toggle').textContent = (next === 'tree') ? '3D' : 'QR';
};

const urlIn = document.getElementById('url-input');
const urlTheme = document.getElementById('url-theme');
const urlBtn = document.getElementById('url-gen');
const urlStatus = document.getElementById('url-status');
const copyEmbedBtn = document.getElementById('copy-embed-btn');
const snapBtn = document.getElementById('snap');

// Bottom-right status: plain text, or a label + thin progress bar + % when a
// percentage is given.
function setStatus(label, pct) {
  if (pct == null) { urlStatus.textContent = label; return; }
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  urlStatus.innerHTML =
    label + ' <span class="pbar"><i style="width:' + p + '%"></i></span> ' + p + '%';
}

// Generate stays disabled until the backend is actually ready — a transient
// failure must never leave a clickable button over a fake "Ready".
urlBtn.disabled = true;
setStatus('Loading model');

const READY_LABEL = { local: 'Ready · local weights', server: 'Ready · server' };

// Themes come from the backend (manifest or API) so the UI can never drift
// from what the trained model knows about.
client.themes().then(themes => {
  for (const th of themes) {
    const o = document.createElement('option');
    o.value = th.name; o.textContent = th.label;
    urlTheme.appendChild(o);
  }
  // Prepare the backend after the page is interactive (in-browser mode
  // downloads the weights here; server mode is a no-op).
  return client.prepare(() => {
    const st = client.state();
    setStatus('Downloading model', st.total ? (st.bytes / st.total) * 100 : 0);
  });
}).then(() => {
  const st = client.state();
  if (st.phase === 'downloaded' || st.phase === 'ready') {
    urlBtn.disabled = false;
    setStatus(READY_LABEL[client.source()] || 'Ready');
  } else {
    urlBtn.disabled = true;
    setStatus('Model load failed — reload to retry');
  }
}).catch(e => { urlBtn.disabled = true; setStatus('Backend error: ' + e.message); });

async function generateFromUrl() {
  const url = urlIn.value.trim();
  if (!url) { urlStatus.textContent = 'Please enter a URL.'; return; }
  const theme = urlTheme.value;
  urlBtn.disabled = true;
  const t0 = performance.now();
  try {
    const result = await client.generate({
      url, theme,
      onPhase: (phase, info) => {
        if (phase === 'waiting-download') {
          setStatus('Loading model', info.totalBytes ? (info.downloadedBytes / info.totalBytes) * 100 : 0);
        } else if (phase === 'sampling') {
          if (info.total) setStatus('Generating', (info.step / info.total) * 100);
          else setStatus('Generating…');
        }
      },
    });
    showCells(result.cells);
    copyEmbedBtn.disabled = false;
    setStatus(READY_LABEL[client.source()] || 'Ready');
  } catch (e) {
    setStatus('Error: ' + e.message);
  } finally {
    urlBtn.disabled = false;
  }
}

urlBtn.onclick = generateFromUrl;
urlIn.addEventListener('keydown', e => { if (e.key === 'Enter') generateFromUrl(); });

snapBtn.onclick = () => {
  const a = document.createElement('a');
  a.href = viewer.snapshot();
  a.download = 'qrbloom_tree.png';
  a.click();
};

// Copy embed: freeze the CURRENT tree into a one-line <iframe>. The cell data
// is gzip+base64url-packed into the iframe URL hash, so embed.html renders it
// exactly as shown — no model, no inference, no host-page dependency. The user
// pastes the iframe into any site; it's fully isolated inside its own document.
copyEmbedBtn.onclick = async () => {
  if (!_embedCells.length) return;
  try {
    const json = JSON.stringify(_embedCells);
    const cs = new CompressionStream('gzip');
    const bytes = new Uint8Array(await new Response(
      new Blob([new TextEncoder().encode(json)]).stream().pipeThrough(cs)).arrayBuffer());
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    const enc = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const src = new URL('embed.html', location.href).href + '#' + enc;
    const code = `<iframe src="${src}" width="420" height="420" frameborder="0" `
               + `style="border:0;border-radius:10px;overflow:hidden"></iframe>`;
    await navigator.clipboard.writeText(code);
    copyEmbedBtn.textContent = 'Copied!';
    copyEmbedBtn.classList.add('copied');
    setTimeout(() => {
      copyEmbedBtn.textContent = 'Copy embed';
      copyEmbedBtn.classList.remove('copied');
    }, 2200);
  } catch (e) { alert('Copy failed: ' + e.message); }
};
</script>
</body></html>
