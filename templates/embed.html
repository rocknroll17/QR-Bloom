<!-- QR-Bloom embeddable 3D voxel tree — paste into any web page -->
<div id="qrbloom-embed" style="width:420px;height:420px;display:inline-block;border-radius:10px;overflow:hidden;background:#f8fafc;"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CELLS = __CELLS__;

const container = document.getElementById('qrbloom-embed');
const W = 420, H = 420;

// Renderer — same setup as the QR-Bloom gallery (index.html).
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8fafc);

// Neutral studio lighting via RoomEnvironment (no external HDRI dependency).
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const aspect = W / H;
const half = 26;
const camera = new THREE.OrthographicCamera(
  -half * aspect, half * aspect, half, -half, 0.1, 500
);
camera.position.set(40, 22, 40);
camera.lookAt(0, 8, 0);

const amb = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(20, 30, 20);
dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
dir.shadow.camera.left = -30; dir.shadow.camera.right = 30;
dir.shadow.camera.top = 30; dir.shadow.camera.bottom = -30;
dir.shadow.camera.near = 1; dir.shadow.camera.far = 100;
dir.shadow.bias = -0.0002; dir.shadow.normalBias = 0.02;
scene.add(dir);

// Build InstancedMesh — group by color for efficiency.
const geo = new THREE.BoxGeometry(1, 1, 1);
const byColor = new Map();
for (const [x, y, z, scale, color] of CELLS) {
  const key = color + '|' + scale;
  if (!byColor.has(key)) byColor.set(key, { color, scale, positions: [] });
  byColor.get(key).positions.push([x, y, z]);
}

const M = new THREE.Matrix4();
const Q = new THREE.Quaternion();
const P = new THREE.Vector3();
for (const { color, scale, positions } of byColor.values()) {
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(color), roughness: 0.9, metalness: 0.0,
  });
  const mesh = new THREE.InstancedMesh(geo, mat, positions.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const S = new THREE.Vector3(scale, scale, scale);
  for (let i = 0; i < positions.length; i++) {
    P.set(positions[i][0], positions[i][1], positions[i][2]);
    M.compose(P, Q, S);
    mesh.setMatrixAt(i, M);
  }
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// Gentle auto-rotation around Y axis (turntable).
let angle = Math.PI / 4;
const RADIUS = 62;
const TARGET_Y = 8;
function animate() {
  requestAnimationFrame(animate);
  angle += 0.005;
  camera.position.set(
    Math.cos(angle) * RADIUS * 0.65,
    22,
    Math.sin(angle) * RADIUS * 0.65
  );
  camera.lookAt(0, TARGET_Y, 0);
  renderer.render(scene, camera);
}
animate();
</script>
</content>
